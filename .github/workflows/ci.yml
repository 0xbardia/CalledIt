name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `npm ci` needs --legacy-peer-deps. package-lock.json ships RainbowKit 2.2.8,
# whose declared peer range is wagmi@^2, while the project deliberately runs
# wagmi 3.7.7. The lockfile — not npm's peer re-resolution — is the source of
# truth for what was built, certified and deployed, so the install is pinned to
# it rather than changed.

jobs:
  app:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          ALLOW_SIMULATOR: "false"
          NODE_ENV: production

  contract:
    name: Contract Direct Mode and linter
    runs-on: ubuntu-latest
    env:
      # The GenVM release that carries the runner pinned by the contract's
      # Depends header. Bumping it means re-auditing the SDK, so it is pinned
      # here rather than tracking "latest".
      GENVM_VERSION: v0.3.0-rc7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the contract toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install genlayer-test pytest genvm-linter
      - name: Lint, validate and typecheck the contract
        run: |
          genvm-lint download --version "$GENVM_VERSION"
          genvm-lint check contracts/calledit.py
          genvm-lint typecheck contracts/calledit.py
      - name: Seed the Direct Mode runner bundle
        run: |
          # genlayer-test 0.29.2 looks for `genvm-universal.tar.xz`, an asset
          # name recent GenVM releases no longer publish. It skips the download
          # when its cache already holds `genvm-universal-<version>.tar.xz`, so
          # seed it from the pinned release's current asset name. This also
          # removes the dependency on whatever "latest" happens to be.
          mkdir -p ~/.cache/gltest-direct
          curl --fail --location --retry 3 --silent --show-error \
            -o ~/.cache/gltest-direct/genvm-universal-$GENVM_VERSION.tar.xz \
            "https://github.com/genlayerlabs/genvm/releases/download/$GENVM_VERSION/genvm-runners-all.tar.xz"
      - name: Direct Mode suite
        run: python -m pytest tests/contract -q
      - name: The committed source must be the certified source
        run: |
          echo "d246b9505f0a2cc0003b7487c5eeae01847d7a7f70be32c9440cb0322fdef02c  contracts/calledit.py" | sha256sum --check

  backend:
    name: Backend certification against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: calledit
          POSTGRES_USER: calledit
          POSTGRES_PASSWORD: calledit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calledit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://calledit:calledit@127.0.0.1:5432/calledit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/migrate.mjs
      - run: npm run test:db
